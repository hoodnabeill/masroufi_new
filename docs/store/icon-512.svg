  <rect width="108" height="108" fill="#0A1033"/>
  <g transform="translate(54 54) scale(0.8) translate(-54 -48)">
    <g transform="rotate(-10 54 57)">
      <path fill="#35E0D0" d="M42,36Q49,10 68,22Q59,26 60,37Z"/>
      <path fill="#FFC72C" fill-rule="evenodd" d="M26,35h36a5,5 0 0 0 10,0h10a9,9 0 0 1 9,9v28a9,9 0 0 1 -9,9H72a5,5 0 0 0 -10,0H26a9,9 0 0 1 -9,-9V44a9,9 0 0 1 9,-9zM40,50a8,8 0 1 0 0,16a8,8 0 1 0 0,-16z"/>
    </g>
  </g>
</svg>
