<!-- Play Store icon (export to a 512x512 PNG; CI also renders icon-512.png in the store-assets artifact).
     "التذكرة" (13-ICON.md): same geometry as the adaptive icon (res/drawable/ic_launcher_background.xml and
     ic_launcher_foreground.xml). The night square is the background layer; the artwork is the foreground layer scaled
     0.8 so it sits inside the launcher's 66% safe zone. No mask: Play applies its own. -->
