<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مصروفي · تسجيل سريع</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Readex+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A10}
a{color:#A99BFF;text-decoration:none}a:hover{color:#C9C0FF}
.k:active{background:#272435}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #050408; color: #F4F2FA; font-family: 'IBM Plex Sans Arabic', sans-serif;">

  <div style="position: absolute; top: 48px; left: 0; right: 0; bottom: 0; box-sizing: border-box; border-radius: 32px 32px 0 0; background: #15131D; border-top: 1px solid #2A2737; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 14px;">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #3A3648; align-self: center;"></div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <div role="group" aria-label="نوع العملية" style="flex-grow: 1; height: 44px; box-sizing: border-box; padding: 4px; border-radius: 22px; background: #0B0A10; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
          <button onClick="{{t.pick}}" style="border: none; border-radius: 18px; background: {{t.bg}}; color: {{t.fg}}; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 14px; font-weight: {{t.fw}}; cursor: pointer;">{{t.label}}</button>
        </sc-for>
      </div>
      <a href="Main.dc.html" aria-label="اقفل" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #1D1B28; color: #B4AFC6; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; padding: 16px 0 4px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span dir="ltr" style="font-family: 'Readex Pro', sans-serif; font-size: 64px; font-weight: 700; letter-spacing: -2px; line-height: 1.1; color: {{amountColor}};">{{display}}</span>
        <span style="font-size: 20px; font-weight: 500; color: #B4AFC6;">ج.م</span>
      </div>
      <div style="margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <span style="font-size: 13px; color: {{noteColor}}; text-align: center;">{{note}}</span>
        <sc-if value="{{showBar}}" hint-placeholder-val="{{true}}">
          <div style="width: 160px; height: 4px; border-radius: 2px; background: #272435; overflow: hidden;">
            <div style="width: {{barW}}%; height: 100%; border-radius: 2px; background: {{barColor}};"></div>
          </div>
        </sc-if>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; color: #8E89A3;">على إيه؟</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 40px; box-sizing: border-box; padding: 0 12px 0 14px; border-radius: 20px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{c.c}};"><path d="{{c.icon}}"></path></svg>
            <span>{{c.label}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; gap: 8px;">
      <button style="height: 40px; padding: 0 12px; border-radius: 14px; border: 1px solid #2A2737; background: transparent; color: #B4AFC6; display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 13px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"></rect><path d="M3 10h18M16 15h2"></path></svg>
        <span>الكاش</span>
      </button>
      <button style="height: 40px; padding: 0 12px; border-radius: 14px; border: 1px solid #2A2737; background: transparent; color: #B4AFC6; display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 13px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        <span>النهارده</span>
      </button>
      <button style="height: 40px; padding: 0 12px; border-radius: 14px; border: 1px solid #2A2737; background: transparent; color: #B4AFC6; display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 13px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
        <span>ملاحظة</span>
      </button>
    </div>

    <div dir="ltr" style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <button class="k" onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 52px; border: none; border-radius: 16px; background: transparent; color: #F4F2FA; font-family: 'Readex Pro', sans-serif; font-size: 26px; font-weight: 500; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <sc-if value="{{k.isNum}}" hint-placeholder-val="{{true}}"><span>{{k.label}}</span></sc-if>
          <sc-if value="{{k.isBack}}" hint-placeholder-val="{{false}}">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"></path><path d="m12 9 6 6M18 9l-6 6"></path></svg>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <a href="Reward.dc.html" style="height: 56px; flex-shrink: 0; border-radius: 28px; background: #C8F169; color: #12160A; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Readex Pro', sans-serif; font-size: 17px; font-weight: 600;">
      <span>{{saveLabel}}</span>
      <span style="padding: 3px 9px; border-radius: 10px; background: #A9D24F; font-size: 12px; font-weight: 600;">+10 نقطة</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const amount = s.amount != null ? s.amount : '85';
    const type = s.type || 'expense';
    const cat = s.cat || 'food';
    const set = (patch) => this.setState(patch);
    const press = (k) => () => {
      const cur = (this.state && this.state.amount != null) ? this.state.amount : '85';
      let a = cur;
      if (k === 'back') {
        a = cur.slice(0, -1);
      } else if (k === '.') {
        if (cur.indexOf('.') === -1) a = (cur === '' ? '0' : cur) + '.';
      } else if (cur === '0' || cur === '') {
        a = k;
      } else {
        const p = cur.split('.');
        if (p.length === 2 && p[1].length >= 2) a = cur;
        else if (p.length === 1 && p[0].length >= 7) a = cur;
        else a = cur + k;
      }
      set({ amount: a });
    };
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'back'].map((k) => ({
      label: k,
      isBack: k === 'back',
      isNum: k !== 'back',
      aria: k === 'back' ? 'امسح' : (k === '.' ? 'علامة عشرية' : k),
      press: press(k)
    }));

    const raw = amount === '' ? '0' : amount;
    const parts = raw.split('.');
    const intPart = (parts[0] || '0').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const display = parts.length > 1 ? intPart + '.' + parts[1] : intPart;
    const num = parseFloat(raw) || 0;
    const safe = 156;

    const typeDefs = [
      { id: 'expense', label: 'صرف', color: '#F4F2FA', save: 'سجّل الصرف' },
      { id: 'income', label: 'دخل', color: '#C8F169', save: 'سجّل الدخل' },
      { id: 'transfer', label: 'تحويل', color: '#7DB4FF', save: 'حوّل' },
      { id: 'loan', label: 'سلفة', color: '#FFB648', save: 'سجّل السلفة' }
    ];
    const types = typeDefs.map((t) => {
      const on = t.id === type;
      return {
        id: t.id,
        label: t.label,
        bg: on ? '#272435' : 'transparent',
        fg: on ? '#F4F2FA' : '#8E89A3',
        fw: on ? '600' : '500',
        pick: () => set({ type: t.id })
      };
    });
    const current = typeDefs.find((t) => t.id === type) || typeDefs[0];

    let note = '';
    let noteColor = '#B4AFC6';
    let showBar = false;
    let barW = 0;
    let barColor = '#C8F169';
    if (num === 0) {
      note = 'اكتب المبلغ';
      noteColor = '#8E89A3';
    } else if (type === 'expense') {
      const pct = Math.round((num / safe) * 100);
      showBar = true;
      barW = Math.min(100, pct);
      if (num <= safe) {
        note = 'ده ' + pct + '% من اللي تقدر تصرفه النهارده';
        barColor = pct > 80 ? '#FFB648' : '#C8F169';
      } else {
        note = 'أكتر من المتاح النهارده بـ ' + Math.round(num - safe).toLocaleString('en-US') + ' ج.م';
        noteColor = '#FF8C73';
        barColor = '#FF8C73';
      }
    } else if (type === 'income') {
      note = 'اللي تقدر تصرفه هيبقى ' + Math.round((4527 + num) / 29) + ' ج.م في اليوم';
      noteColor = '#C8F169';
    } else if (type === 'transfer') {
      note = 'من الكاش إلى فودافون كاش';
    } else {
      note = 'هفكّرك تسترجعهم بعد أسبوعين';
    }

    const catDefs = [
      { id: 'food', label: 'أكل ومطاعم', c: '#FF8C73', dim: '#33201C', icon: 'M6 3v6a3 3 0 0 0 6 0V3M9 3v18M17 3c-2 2-2.5 6 0 8v10' },
      { id: 'transport', label: 'مواصلات', c: '#7DB4FF', dim: '#1A2638', icon: 'M4 16v-5l2-5h12l2 5v5zM4 11h16M7 16v3M17 16v3' },
      { id: 'grocery', label: 'بقالة', c: '#FFD466', dim: '#332A12', icon: 'M3 4h2l2.4 11h10.2L20 8H6.2M7.7 19.5a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0-2.6 0M15.7 19.5a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0-2.6 0' },
      { id: 'mobile', label: 'موبايل', c: '#5EE3A1', dim: '#15302A', icon: 'M8.5 2h7A2.5 2.5 0 0 1 18 4.5v15a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 6 19.5v-15A2.5 2.5 0 0 1 8.5 2zM11 18h2' },
      { id: 'fun', label: 'ترفيه', c: '#E7A6FF', dim: '#2E1F38', icon: 'M6 5h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3zM10 9l5 3-5 3z' },
      { id: 'other', label: 'تانية', c: '#A99BFF', dim: '#262046', icon: 'M5.5 3.5h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2zM15.5 3.5h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2zM5.5 13.5h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2zM15.5 13.5h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2z' }
    ];
    const cats = catDefs.map((c) => {
      const on = c.id === cat;
      return {
        id: c.id,
        label: c.label,
        icon: c.icon,
        c: c.c,
        bg: on ? c.dim : '#1D1B28',
        border: on ? c.c : '#2A2737',
        fg: on ? '#F4F2FA' : '#B4AFC6',
        pressed: on ? 'true' : 'false',
        pick: () => set({ cat: c.id })
      };
    });

    return {
      types: types,
      cats: cats,
      keys: keys,
      display: display,
      amountColor: current.color,
      saveLabel: current.save,
      note: note,
      noteColor: noteColor,
      showBar: showBar,
      barW: barW,
      barColor: barColor
    };
  }
}
</script>
</body>
</html>
