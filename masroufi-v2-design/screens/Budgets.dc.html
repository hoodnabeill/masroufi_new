<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مصروفي · الخطة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Readex+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A10}
a{color:#A99BFF;text-decoration:none}a:hover{color:#C9C0FF}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0A10; color: #F4F2FA; font-family: 'IBM Plex Sans Arabic', sans-serif; padding: 24px 0 0;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px;">
    <h1 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 28px; font-weight: 700;">الخطة</h1>
    <a href="NewBudget.dc.html" aria-label="ميزانية جديدة" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A2737; background: #15131D; color: #F4F2FA; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </header>

  <div role="tablist" style="margin: 14px 16px 0; height: 48px; box-sizing: border-box; padding: 4px; border-radius: 24px; background: #15131D; border: 1px solid #2A2737; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px;">
    <span role="tab" aria-selected="true" style="border-radius: 20px; background: #272435; color: #F4F2FA; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">الميزانيات</span>
    <a href="Goals.dc.html" role="tab" aria-selected="false" style="border-radius: 20px; color: #8E89A3; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500;">الأهداف</a>
  </div>

  <section style="margin: 14px 16px 0; padding: 18px; border-radius: 24px; background: #15131D; border: 1px solid #34431F; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: flex-start; gap: 12px;">
      <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; background: #24301A; color: #C8F169; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 17l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <h2 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 16px; font-weight: 600;">مصروفي جهّزلك خطة</h2>
        <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #B4AFC6;">على أساس صرفك من أول الشهر، عشان فلوسك تكفّي لآخر نوفمبر.</p>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <button onClick="{{r.toggle}}" role="checkbox" aria-checked="{{r.ariaChecked}}" style="width: 100%; padding: 10px 0; border: none; background: transparent; color: #F4F2FA; display: flex; align-items: center; gap: 12px; text-align: right; font-family: 'IBM Plex Sans Arabic', sans-serif; cursor: pointer;">
          <span style="width: 24px; height: 24px; box-sizing: border-box; flex-shrink: 0; border-radius: 8px; border: {{r.boxBorder}}; background: {{r.boxBg}}; color: #12160A; display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{r.on}}" hint-placeholder-val="{{true}}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
            </sc-if>
          </span>
          <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 13px; background: {{r.dim}}; color: {{r.c}}; display: flex; align-items: center; justify-content: center;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
          </span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; opacity: {{r.opacity}};">
            <span style="display: flex; justify-content: space-between; align-items: baseline;">
              <span style="font-size: 15px; font-weight: 500;">{{r.name}}</span>
              <span style="font-family: 'Readex Pro', sans-serif; font-size: 16px; font-weight: 600;">{{r.limit}}</span>
            </span>
            <span style="height: 4px; border-radius: 2px; background: #272435; overflow: hidden; display: block;">
              <span style="display: block; width: {{r.pct}}%; height: 100%; border-radius: 2px; background: {{r.barColor}};"></span>
            </span>
            <span style="font-size: 12px; color: #8E89A3;">{{r.sub}}</span>
          </span>
        </button>
      </sc-for>
    </div>

    <div style="height: 1px; background: #2A2737;"></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 13px;">
      <span style="color: #8E89A3;">إجمالي الخطة</span>
      <span><span style="font-family: 'Readex Pro', sans-serif; font-size: 16px; font-weight: 600;">{{total}}</span><span style="color: #8E89A3;"> من 4,527 معاك</span></span>
    </div>
    <a href="Main.dc.html" style="height: 52px; border-radius: 26px; background: {{ctaBg}}; color: {{ctaFg}}; display: flex; align-items: center; justify-content: center; font-family: 'Readex Pro', sans-serif; font-size: 16px; font-weight: 600;">{{cta}}</a>
    <a href="NewBudget.dc.html" style="align-self: center; font-size: 14px; padding: 4px 8px;">اعمل ميزانية بنفسك</a>
  </section>

  <section style="margin: 12px 16px 0; padding: 16px; border-radius: 24px; background: #1E170D; border: 1px solid #4A3A1C; display: flex; align-items: center; gap: 12px;">
    <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #33260F; color: #FFB648; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"></path></svg>
    </span>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 12px; font-weight: 600; color: #FFB648;">تحدّي الأسبوع</span>
      <span style="font-family: 'Readex Pro', sans-serif; font-size: 15px; font-weight: 600;">3 أيام من غير أكل برّه</span>
      <span style="font-size: 12px; color: #B4AFC6;">+50 نقطة · شارة «طبّاخ البيت»</span>
    </div>
    <button style="height: 40px; padding: 0 18px; flex-shrink: 0; border-radius: 20px; border: none; background: #FFB648; color: #1A1206; font-family: 'Readex Pro', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;">ابدأ</button>
  </section>

  <nav aria-label="التنقل الرئيسي" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 72px; box-sizing: border-box; border-radius: 28px; background: #15131D; border: 1px solid #2A2737; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: space-around; padding: 0 6px;">
    <a href="Main.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E89A3; padding-bottom: 7px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
      <span style="font-size: 11px;">الرئيسية</span>
    </a>
    <a href="Activity.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E89A3; padding-bottom: 7px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16"></path><path d="m8 14 3.5-3.5 3 3L20 8"></path></svg>
      <span style="font-size: 11px;">الحركة</span>
    </a>
    <a href="AddSheet.dc.html" aria-label="سجّل عملية جديدة" style="width: 60px; height: 60px; box-sizing: border-box; flex-shrink: 0; margin-top: -30px; border-radius: 30px; border: 4px solid #0B0A10; background: #C8F169; color: #12160A; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(200, 241, 105, 0.28);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <span aria-current="page" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #F4F2FA;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>
      <span style="font-size: 11px; font-weight: 600;">الخطة</span>
      <span style="width: 4px; height: 4px; border-radius: 2px; background: #C8F169;"></span>
    </span>
    <a href="More.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E89A3; padding-bottom: 7px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="2"></rect></svg>
      <span style="font-size: 11px;">المزيد</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const off = s.off || {};
    const defs = [
      { id: 'mobile', name: 'موبايل وإنترنت', limit: 600, spent: 580, c: '#5EE3A1', dim: '#15302A', note: 'الفاتورة اتدفعت', icon: 'M8.5 2h7A2.5 2.5 0 0 1 18 4.5v15a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 6 19.5v-15A2.5 2.5 0 0 1 8.5 2zM11 18h2' },
      { id: 'food', name: 'أكل ومطاعم', limit: 1200, spent: 320, c: '#FF8C73', dim: '#33201C', note: 'يعني 40 في اليوم', icon: 'M6 3v6a3 3 0 0 0 6 0V3M9 3v18M17 3c-2 2-2.5 6 0 8v10' },
      { id: 'transport', name: 'مواصلات', limit: 900, spent: 205, c: '#7DB4FF', dim: '#1A2638', note: 'يعني 30 في اليوم', icon: 'M4 16v-5l2-5h12l2 5v5zM4 11h16M7 16v3M17 16v3' }
    ];
    const fmt = (n) => n.toLocaleString('en-US');
    let total = 0;
    let count = 0;
    const rows = defs.map((d) => {
      const on = !off[d.id];
      if (on) { total += d.limit; count += 1; }
      const pct = Math.min(100, Math.round((d.spent / d.limit) * 100));
      return {
        name: d.name,
        icon: d.icon,
        c: d.c,
        dim: d.dim,
        on: on,
        ariaChecked: on ? 'true' : 'false',
        limit: fmt(d.limit),
        pct: pct,
        barColor: pct >= 90 ? '#FFB648' : '#C8F169',
        sub: 'صرفت ' + fmt(d.spent) + ' · ' + d.note,
        opacity: on ? '1' : '0.45',
        boxBg: on ? '#C8F169' : 'transparent',
        boxBorder: on ? 'none' : '1.5px solid #4A4659',
        toggle: () => {
          const cur = (this.state && this.state.off) || {};
          const next = Object.assign({}, cur);
          next[d.id] = !cur[d.id];
          this.setState({ off: next });
        }
      };
    });
    let cta = 'اختار ميزانية الأول';
    if (count === 3) cta = 'فعّل الـ 3 ميزانيات';
    else if (count === 2) cta = 'فعّل الميزانيتين';
    else if (count === 1) cta = 'فعّل الميزانية';
    return {
      rows: rows,
      total: fmt(total),
      cta: cta,
      ctaBg: count > 0 ? '#C8F169' : '#272435',
      ctaFg: count > 0 ? '#12160A' : '#8E89A3'
    };
  }
}
</script>
</body>
</html>
