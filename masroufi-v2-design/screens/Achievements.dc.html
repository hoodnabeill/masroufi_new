<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مصروفي · إنجازاتك</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Readex+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A10}
a{color:#A99BFF;text-decoration:none}a:hover{color:#C9C0FF}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1180px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0A10; color: #F4F2FA; font-family: 'IBM Plex Sans Arabic', sans-serif; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 12px;">

  <header style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
    <a href="Main.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A2737; background: #15131D; color: #F4F2FA; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 17px; font-weight: 600;">إنجازاتك</h1>
    <span style="width: 44px;"></span>
  </header>

  <section style="padding: 18px; border-radius: 26px; background: #15131D; border: 1px solid #2A2737; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 30px; background: #262046; border: 2px solid #A99BFF; color: #C9C0FF; display: flex; align-items: center; justify-content: center; font-family: 'Readex Pro', sans-serif; font-size: 26px; font-weight: 700;">1</span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Readex Pro', sans-serif; font-size: 17px; font-weight: 600;">مستوى 1 · مبتدئ</span>
        <div style="height: 6px; border-radius: 3px; background: #272435; overflow: hidden;"><div style="width: 40%; height: 100%; border-radius: 3px; background: #A99BFF;"></div></div>
        <span style="font-size: 12px; color: #8E89A3;">40 من 100 نقطة وتبقى «منظّم»</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative;">
      <span aria-hidden="true" style="position: absolute; top: 7px; right: 10%; left: 10%; height: 2px; background: #272435;"></span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;"><span style="width: 16px; height: 16px; border-radius: 8px; background: #C8F169; box-shadow: 0 0 0 4px #24301A;"></span><span style="font-size: 11px; font-weight: 600;">مبتدئ</span><span style="font-size: 10px; color: #8E89A3;">0</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; background: #15131D; border: 2px solid #4A4659;"></span><span style="font-size: 11px; color: #B4AFC6;">منظّم</span><span style="font-size: 10px; color: #8E89A3;">100</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; background: #15131D; border: 2px solid #4A4659;"></span><span style="font-size: 11px; color: #B4AFC6;">شاطر</span><span style="font-size: 10px; color: #8E89A3;">300</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; background: #15131D; border: 2px solid #4A4659;"></span><span style="font-size: 11px; color: #B4AFC6;">محترف</span><span style="font-size: 10px; color: #8E89A3;">700</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; background: #15131D; border: 2px solid #4A4659;"></span><span style="font-size: 11px; color: #B4AFC6;">ملك الفلوس</span><span style="font-size: 10px; color: #8E89A3;">1,500</span></div>
    </div>
  </section>

  <section style="padding: 18px; border-radius: 26px; background: #15131D; border: 1px solid #2A2737; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="width: 46px; height: 46px; flex-shrink: 0; border-radius: 15px; background: #33260F; color: #FFB648; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M12 22c3.9 0 7-2.8 7-6.8 0-2.9-1.5-5.2-3.4-7-.4 1.7-1.3 2.9-2.7 3.5.3-3.3-1-6.4-4-8.7C8.4 5.4 5 8.4 5 15.2 5 19.2 8.1 22 12 22z"></path></svg>
      </span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: 'Readex Pro', sans-serif; font-size: 17px; font-weight: 600;">سلسلة يوم واحد</span>
        <span style="font-size: 12px; color: #8E89A3;">أطول سلسلة: يوم واحد</span>
      </div>
      <span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #1A2638; color: #7DB4FF; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M4.9 7l14.2 10M4.9 17 19.1 7M9 4l3 2 3-2M9 20l3-2 3 2"></path></svg>
        تجميد متاح
      </span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 11px; color: #8E89A3; text-align: center;">
        <span>سبت</span><span>حد</span><span>اتنين</span><span>تلات</span><span>أربع</span><span>خميس</span><span>جمعة</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 6px; justify-items: center;">
        <sc-for list="{{cal}}" as="d" hint-placeholder-count="35">
          <span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 16px; background: {{d.bg}}; border: {{d.border}}; color: {{d.fg}}; display: flex; align-items: center; justify-content: center; font-family: 'Readex Pro', sans-serif; font-size: 12px; font-weight: {{d.fw}};">{{d.label}}</span>
        </sc-for>
      </div>
    </div>
  </section>

  <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 8px 4px 0;">
    <h2 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 18px; font-weight: 600;">الشارات</h2>
    <span style="font-size: 13px; color: #8E89A3;">1 من 9</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
    <sc-for list="{{badges}}" as="b" hint-placeholder-count="9">
      <button onClick="{{b.pick}}" aria-pressed="{{b.aria}}" style="height: 104px; box-sizing: border-box; padding: 10px 6px; border-radius: 20px; border: 1.5px solid {{b.border}}; background: #15131D; color: #F4F2FA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: 'IBM Plex Sans Arabic', sans-serif; cursor: pointer; transition: border-color 200ms ease;">
        <span style="width: 48px; height: 48px; border-radius: 24px; background: {{b.tile}}; color: {{b.iconC}}; display: flex; align-items: center; justify-content: center; position: relative;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg>
          <sc-if value="{{b.locked}}" hint-placeholder-val="{{true}}">
            <span style="position: absolute; bottom: -2px; left: -2px; width: 18px; height: 18px; border-radius: 9px; background: #272435; border: 2px solid #15131D; color: #8E89A3; display: flex; align-items: center; justify-content: center;">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            </span>
          </sc-if>
        </span>
        <span style="font-size: 12px; font-weight: 600;">{{b.name}}</span>
        <span style="font-size: 11px; color: #8E89A3;">{{b.progress}}</span>
      </button>
    </sc-for>
  </div>

  <section aria-live="polite" style="padding: 16px; border-radius: 22px; background: #15131D; border: 1px solid #2A2737; display: flex; align-items: center; gap: 14px;">
    <span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; background: {{sel.tile}}; color: {{sel.iconC}}; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{sel.icon}}"></path></svg>
    </span>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span style="font-family: 'Readex Pro', sans-serif; font-size: 15px; font-weight: 600;">{{sel.name}}</span>
        <span style="font-family: 'Readex Pro', sans-serif; font-size: 13px; font-weight: 600; color: #C8F169;">{{sel.reward}}</span>
      </div>
      <span style="font-size: 13px; color: #B4AFC6;">{{sel.how}}</span>
      <div style="height: 6px; border-radius: 3px; background: #272435; overflow: hidden;"><div style="width: {{sel.pct}}%; height: 100%; border-radius: 3px; background: {{sel.c}}; transition: width 400ms ease;"></div></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const selIdx = s.sel != null ? s.sel : 1;

    const cal = [];
    cal.push({ label: '', bg: 'transparent', border: 'none', fg: '#8E89A3', fw: '400' });
    for (let d = 1; d <= 30; d++) {
      if (d === 1) cal.push({ label: '1', bg: '#FFB648', border: 'none', fg: '#1A1206', fw: '700' });
      else if (d === 2) cal.push({ label: '2', bg: 'transparent', border: '2px solid #FFB648', fg: '#FFB648', fw: '700' });
      else cal.push({ label: String(d), bg: '#1D1B28', border: 'none', fg: '#8E89A3', fw: '400' });
    }
    while (cal.length % 7 !== 0) cal.push({ label: '', bg: 'transparent', border: 'none', fg: '#8E89A3', fw: '400' });

    const defs = [
      { name: 'أول خطوة', how: 'سجّلت أول مصروف ليك. بداية حلوة.', c: '#C8F169', dim: '#24301A', done: 1, of: 1, reward: '+10', icon: 'M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6' },
      { name: 'بدأت صح', how: 'سجّل 3 أيام ورا بعض.', c: '#FFB648', dim: '#33260F', done: 1, of: 3, reward: '+20', icon: 'M12 22c3.9 0 7-2.8 7-6.8 0-2.9-1.5-5.2-3.4-7-.4 1.7-1.3 2.9-2.7 3.5.3-3.3-1-6.4-4-8.7C8.4 5.4 5 8.4 5 15.2 5 19.2 8.1 22 12 22z' },
      { name: 'أسبوع كامل', how: 'سلسلة 7 أيام من غير ما تقطع.', c: '#FFB648', dim: '#33260F', done: 1, of: 7, reward: '+50', icon: 'M6 5h12a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3zM3 10h18M8 3v4M16 3v4M9 15l2 2 4-4' },
      { name: 'يوم صفر', how: 'عدّي يوم كامل من غير أي صرف.', c: '#5EE3A1', dim: '#15302A', done: 0, of: 1, reward: '+20', icon: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM5.6 5.6l12.8 12.8' },
      { name: 'طبّاخ البيت', how: '3 أيام من غير أكل برّه.', c: '#FF8C73', dim: '#33201C', done: 0, of: 3, reward: '+50', icon: 'M6 3v6a3 3 0 0 0 6 0V3M9 3v18M17 3c-2 2-2.5 6 0 8v10' },
      { name: 'المخطط', how: 'اعمل 3 ميزانيات وفعّلهم.', c: '#A99BFF', dim: '#262046', done: 0, of: 3, reward: '+30', icon: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 11.5v1' },
      { name: 'حارس الطوارئ', how: 'ابدأ هدف لفلوس الطوارئ.', c: '#FF8C73', dim: '#33201C', done: 0, of: 1, reward: '+30', icon: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z' },
      { name: 'ابن الجمعية', how: 'سجّل جمعية وادفع أول قسط.', c: '#E7A6FF', dim: '#2E1F38', done: 0, of: 1, reward: '+20', icon: 'M10 5a2 2 0 1 0 4 0a2 2 0 1 0-4 0M3 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0M17 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0M10.8 6.8 6.2 15M13.2 6.8l4.6 8.2M7 17h10' },
      { name: 'الشهر الأخضر', how: 'اقفل الشهر وانت تحت رقمك اليومي.', c: '#C8F169', dim: '#24301A', done: 0, of: 1, reward: '+100', icon: 'M3 17l6-6 4 4 8-8M15 7h6v6' }
    ];

    const badges = defs.map((d, i) => {
      const unlocked = d.done >= d.of;
      const on = i === selIdx;
      return {
        name: d.name,
        icon: d.icon,
        locked: !unlocked,
        tile: unlocked ? d.dim : '#1D1B28',
        iconC: unlocked ? d.c : '#6B6680',
        progress: unlocked ? 'اتفتحت' : d.done + ' من ' + d.of,
        border: on ? '#C8F169' : '#2A2737',
        aria: on ? 'true' : 'false',
        pick: () => this.setState({ sel: i })
      };
    });
    const d = defs[selIdx];
    const unlocked = d.done >= d.of;
    const sel = {
      name: d.name,
      how: d.how,
      icon: d.icon,
      reward: d.reward + ' نقطة',
      c: d.c,
      tile: unlocked ? d.dim : '#1D1B28',
      iconC: unlocked ? d.c : '#8E89A3',
      pct: Math.round((d.done / d.of) * 100)
    };
    return { cal: cal, badges: badges, sel: sel };
  }
}
</script>
</body>
</html>
