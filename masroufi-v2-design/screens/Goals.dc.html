<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مصروفي · الأهداف</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Readex+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A10}
a{color:#A99BFF;text-decoration:none}a:hover{color:#C9C0FF}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1160px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0A10; color: #F4F2FA; font-family: 'IBM Plex Sans Arabic', sans-serif; padding: 24px 0 0;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px;">
    <h1 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 28px; font-weight: 700;">الخطة</h1>
    <a href="NewGoal.dc.html" aria-label="هدف جديد" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A2737; background: #15131D; color: #F4F2FA; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </header>

  <div role="tablist" style="margin: 14px 16px 0; height: 48px; box-sizing: border-box; padding: 4px; border-radius: 24px; background: #15131D; border: 1px solid #2A2737; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px;">
    <a href="Budgets.dc.html" role="tab" aria-selected="false" style="border-radius: 20px; color: #8E89A3; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500;">الميزانيات</a>
    <span role="tab" aria-selected="true" style="border-radius: 20px; background: #272435; color: #F4F2FA; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">الأهداف</span>
  </div>

  <section style="margin: 14px 16px 0; padding: 18px; border-radius: 26px; background: #15131D; border: 1px solid #2A2737; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="width: 100px; height: 100px; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; color: #5EE3A1;">
        <svg width="100" height="100" viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg);">
          <circle cx="50" cy="50" r="42" fill="none" stroke="#15302A" stroke-width="9"></circle>
          <circle cx="50" cy="50" r="42" fill="none" stroke="#5EE3A1" stroke-width="9" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="197.9"></circle>
        </svg>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect><path d="M11 18h2"></path></svg>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-family: 'Readex Pro', sans-serif; font-size: 18px; font-weight: 600;">موبايل جديد</span>
        <span style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-family: 'Readex Pro', sans-serif; font-size: 26px; font-weight: 700; color: #5EE3A1;">3,750</span>
          <span style="font-size: 13px; color: #8E89A3;">من 15,000 ج.م</span>
        </span>
        <span style="align-self: flex-start; padding: 4px 10px; border-radius: 10px; background: #24301A; color: #C8F169; font-size: 12px; font-weight: 600;">متقدم عن الخطة</span>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #8E89A3;">
      <span>25% · بتحوّش 2,000 كل شهر</span>
      <span>الهدف 15 يونيو</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <button style="flex: 1 1 0; height: 48px; border-radius: 24px; border: none; background: #5EE3A1; color: #0B2016; font-family: 'Readex Pro', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;">حوّش دلوقتي</button>
      <button style="height: 48px; padding: 0 20px; border-radius: 24px; border: 1px solid #2A2737; background: transparent; color: #B4AFC6; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 14px; cursor: pointer;">سحب</button>
    </div>
  </section>

  <section style="margin: 12px 16px 0; padding: 18px; border-radius: 26px; background: #1B1830; border: 1px solid #332C55; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 30px; height: 30px; border-radius: 10px; background: #2C2650; color: #A99BFF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg></span>
      <h2 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 16px; font-weight: 600;">وصّلها أسرع</h2>
    </div>
    <span style="font-size: 13px; color: #B4AFC6;">لو حوّشت زيادة كل يوم:</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{boosts}}" as="b" hint-placeholder-count="4">
        <button onClick="{{b.pick}}" aria-pressed="{{b.aria}}" style="height: 44px; border-radius: 22px; border: 1.5px solid {{b.border}}; background: {{b.bg}}; color: {{b.fg}}; font-family: 'Readex Pro', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 200ms ease, border-color 200ms ease;">{{b.label}}</button>
      </sc-for>
    </div>
    <div aria-live="polite" style="padding: 14px 16px; border-radius: 18px; background: #262046; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 12px; color: #C9C0FF;">هتوصل</span>
      <span style="font-family: 'Readex Pro', sans-serif; font-size: 22px; font-weight: 700;">{{finish}}</span>
      <span style="font-size: 13px; color: {{deltaColor}};">{{delta}}</span>
    </div>
  </section>

  <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 22px 20px 10px;">
    <h2 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 18px; font-weight: 600;">أهدافك التانية</h2>
    <span style="font-size: 13px; color: #8E89A3;">2</span>
  </div>
  <div style="margin: 0 16px; border-radius: 24px; background: #15131D; border: 1px solid #2A2737; display: flex; flex-direction: column;">
    <div style="padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2A2737;">
      <span style="width: 42px; height: 42px; flex-shrink: 0; border-radius: 14px; background: #33201C; color: #FF8C73; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg></span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-size: 15px; font-weight: 500;">فلوس الطوارئ</span><span style="font-family: 'Readex Pro', sans-serif; font-size: 14px; font-weight: 600;">850 <span style="font-size: 12px; color: #8E89A3; font-weight: 400;">من 5,000</span></span></div>
        <div style="height: 5px; border-radius: 3px; background: #272435; overflow: hidden;"><div style="width: 17%; height: 100%; border-radius: 3px; background: #FF8C73;"></div></div>
      </div>
    </div>
    <div style="padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
      <span style="width: 42px; height: 42px; flex-shrink: 0; border-radius: 14px; background: #332A12; color: #FFD466; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 500;">المصيف</span>
        <span style="font-size: 12px; color: #8E89A3;">6,000 ج.م · لحد يوليو</span>
      </div>
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #332A12; color: #FFD466; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;">ابدأ</button>
    </div>
  </div>
  <a href="NewGoal.dc.html" style="margin: 10px 16px 0; height: 56px; border-radius: 20px; border: 1.5px dashed #3A3648; display: flex; align-items: center; justify-content: center; gap: 8px; color: #B4AFC6; font-size: 14px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    هدف جديد
  </a>

  <nav aria-label="التنقل الرئيسي" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 72px; box-sizing: border-box; border-radius: 28px; background: #15131D; border: 1px solid #2A2737; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: space-around; padding: 0 6px;">
    <a href="Main.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E89A3; padding-bottom: 7px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
      <span style="font-size: 11px;">الرئيسية</span>
    </a>
    <a href="Activity.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E89A3; padding-bottom: 7px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16"></path><path d="m8 14 3.5-3.5 3 3L20 8"></path></svg>
      <span style="font-size: 11px;">الحركة</span>
    </a>
    <a href="AddSheet.dc.html" aria-label="سجّل عملية جديدة" style="width: 60px; height: 60px; box-sizing: border-box; flex-shrink: 0; margin-top: -30px; border-radius: 30px; border: 4px solid #0B0A10; background: #C8F169; color: #12160A; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(200, 241, 105, 0.28);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <span aria-current="page" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #F4F2FA;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>
      <span style="font-size: 11px; font-weight: 600;">الخطة</span>
      <span style="width: 4px; height: 4px; border-radius: 2px; background: #C8F169;"></span>
    </span>
    <a href="More.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E89A3; padding-bottom: 7px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="2"></rect></svg>
      <span style="font-size: 11px;">المزيد</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1160}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const extra = s.extra != null ? s.extra : 20;
    const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
    const remaining = 15000 - 3750;
    const finishFor = (perDay) => {
      const monthly = 2000 + perDay * 30;
      const days = Math.round((remaining / monthly) * 30.44);
      const d = new Date(2026, 10, 2);
      d.setDate(d.getDate() + days);
      return { days: days, label: d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear(), monthly: monthly };
    };
    const base = finishFor(0);
    const now = finishFor(extra);
    const weeks = Math.floor((base.days - now.days) / 7);
    const opts = [
      { v: 0, label: 'زي ما أنا' },
      { v: 10, label: '+10' },
      { v: 20, label: '+20' },
      { v: 50, label: '+50' }
    ];
    const boosts = opts.map((o) => {
      const on = o.v === extra;
      return {
        label: o.label,
        aria: on ? 'true' : 'false',
        border: on ? '#A99BFF' : '#332C55',
        bg: on ? '#A99BFF' : 'transparent',
        fg: on ? '#17132E' : '#C9C0FF',
        pick: () => this.setState({ extra: o.v })
      };
    });
    let delta;
    if (extra === 0) delta = 'بتحوّش 2,000 في الشهر، وده قبل ميعادك أصلاً';
    else delta = 'أسرع بـ ' + weeks + ' أسابيع · ' + now.monthly.toLocaleString('en-US') + ' ج.م في الشهر';
    return {
      boosts: boosts,
      finish: now.label,
      delta: delta,
      deltaColor: extra === 0 ? '#B4AFC6' : '#C8F169'
    };
  }
}
</script>
</body>
</html>
