<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مصروفي · ميزانية جديدة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Readex+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A10}
a{color:#A99BFF;text-decoration:none}a:hover{color:#C9C0FF}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0A10; color: #F4F2FA; font-family: 'IBM Plex Sans Arabic', sans-serif; padding: 20px 16px 0;">

  <header style="display: flex; align-items: center; justify-content: space-between;">
    <a href="Budgets.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A2737; background: #15131D; color: #F4F2FA; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 17px; font-weight: 600;">ميزانية جديدة</h1>
    <span style="width: 44px;"></span>
  </header>

  <h2 style="margin: 18px 4px 8px; font-size: 14px; font-weight: 500; color: #B4AFC6;">على إيه؟</h2>
  <div role="radiogroup" aria-label="الفئة" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
      <button onClick="{{c.pick}}" role="radio" aria-checked="{{c.aria}}" style="height: 72px; box-sizing: border-box; border-radius: 18px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{c.c}};"><path d="{{c.icon}}"></path></svg>
        <span>{{c.label}}</span>
      </button>
    </sc-for>
  </div>

  <h2 style="margin: 18px 4px 4px; font-size: 14px; font-weight: 500; color: #B4AFC6;">كام في الشهر؟</h2>
  <div style="padding: 0 4px 8px; border-bottom: 2px solid #C8F169; display: flex; align-items: baseline; gap: 8px;">
    <span style="font-family: 'Readex Pro', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -1px; line-height: 1.15;">{{limitLabel}}</span>
    <span style="font-size: 18px; color: #B4AFC6;">ج.م</span>
  </div>
  <div style="margin-top: 10px; display: flex; gap: 8px;">
    <sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
      <button onClick="{{p.pick}}" aria-pressed="{{p.aria}}" style="flex: 1 1 0; height: 40px; border-radius: 20px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: 'Readex Pro', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer;">{{p.label}}</button>
    </sc-for>
  </div>

  <section style="margin-top: 14px; padding: 16px; border-radius: 22px; background: #15131D; border: 1px solid #2A2737; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 13px; color: #B4AFC6;">يعني</span>
      <span style="font-family: 'Readex Pro', sans-serif; font-size: 22px; font-weight: 700; color: #C8F169;">{{daily}}</span>
      <span style="font-size: 14px; color: #B4AFC6;">ج.م في اليوم</span>
    </div>
    <div style="height: 6px; border-radius: 3px; background: #272435; overflow: hidden;">
      <div style="width: {{pct}}%; height: 100%; border-radius: 3px; background: {{barColor}};"></div>
    </div>
    <span style="font-size: 12px; color: {{subColor}};">{{sub}}</span>
  </section>

  <section style="margin-top: 14px; border-radius: 22px; background: #15131D; border: 1px solid #2A2737; display: flex; flex-direction: column;">
    <button style="height: 52px; padding: 0 16px; border: none; background: transparent; color: #F4F2FA; display: flex; align-items: center; justify-content: space-between; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 14px; cursor: pointer;">
      <span>التكرار</span>
      <span style="display: flex; align-items: center; gap: 6px; color: #B4AFC6;">كل شهر
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
      </span>
    </button>
    <div style="height: 1px; background: #2A2737; margin: 0 16px;"></div>
    <div style="height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-size: 14px;">
      <span>رحّل الباقي للشهر الجاي</span>
      <button onClick="{{toggleRoll}}" role="switch" aria-checked="{{rollAria}}" aria-label="رحّل الباقي للشهر الجاي" style="width: 48px; height: 28px; padding: 3px; box-sizing: border-box; border-radius: 14px; border: none; background: {{rollTrack}}; display: flex; justify-content: {{rollJustify}}; cursor: pointer;">
        <span style="width: 22px; height: 22px; border-radius: 11px; background: {{rollKnob}};"></span>
      </button>
    </div>
    <div style="height: 1px; background: #2A2737; margin: 0 16px;"></div>
    <button style="height: 52px; padding: 0 16px; border: none; background: transparent; color: #F4F2FA; display: flex; align-items: center; justify-content: space-between; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 14px; cursor: pointer;">
      <span>نبّهني لما أوصل</span>
      <span style="display: flex; align-items: center; gap: 6px; color: #B4AFC6;">80%
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
      </span>
    </button>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 24px; background: #0B0A10; border-top: 1px solid #1D1B28;">
    <a href="Budgets.dc.html" style="height: 56px; border-radius: 28px; background: #C8F169; color: #12160A; display: flex; align-items: center; justify-content: center; font-family: 'Readex Pro', sans-serif; font-size: 17px; font-weight: 600;">احفظ الميزانية</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const cat = s.cat || 'food';
    const limit = s.limit || 1200;
    const roll = s.roll != null ? s.roll : true;
    const set = (patch) => this.setState(patch);
    const fmt = (n) => Math.round(n).toLocaleString('en-US');

    const defs = [
      { id: 'all', label: 'كل الصرف', c: '#A99BFF', dim: '#262046', spent: 1105, icon: 'M5.5 3.5h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2zM15.5 3.5h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2zM5.5 13.5h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2zM15.5 13.5h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2z' },
      { id: 'food', label: 'أكل', c: '#FF8C73', dim: '#33201C', spent: 320, icon: 'M6 3v6a3 3 0 0 0 6 0V3M9 3v18M17 3c-2 2-2.5 6 0 8v10' },
      { id: 'transport', label: 'مواصلات', c: '#7DB4FF', dim: '#1A2638', spent: 205, icon: 'M4 16v-5l2-5h12l2 5v5zM4 11h16M7 16v3M17 16v3' },
      { id: 'grocery', label: 'بقالة', c: '#FFD466', dim: '#332A12', spent: 0, icon: 'M3 4h2l2.4 11h10.2L20 8H6.2M7.7 19.5a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0-2.6 0M15.7 19.5a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0-2.6 0' },
      { id: 'mobile', label: 'موبايل', c: '#5EE3A1', dim: '#15302A', spent: 580, icon: 'M8.5 2h7A2.5 2.5 0 0 1 18 4.5v15a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 6 19.5v-15A2.5 2.5 0 0 1 8.5 2zM11 18h2' },
      { id: 'fun', label: 'ترفيه', c: '#E7A6FF', dim: '#2E1F38', spent: 0, icon: 'M6 5h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3zM10 9l5 3-5 3z' },
      { id: 'home', label: 'بيت', c: '#FFA36B', dim: '#33231A', spent: 0, icon: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z' },
      { id: 'other', label: 'تانية', c: '#B4AFC6', dim: '#24222E', spent: 0, icon: 'M5 12h.01M12 12h.01M19 12h.01' }
    ];
    const cats = defs.map((d) => {
      const on = d.id === cat;
      return {
        label: d.label,
        icon: d.icon,
        c: d.c,
        bg: on ? d.dim : '#15131D',
        border: on ? d.c : '#2A2737',
        fg: on ? '#F4F2FA' : '#B4AFC6',
        aria: on ? 'true' : 'false',
        pick: () => set({ cat: d.id })
      };
    });
    const current = defs.find((d) => d.id === cat) || defs[1];

    const presets = [800, 1000, 1200, 1500].map((v) => {
      const on = v === limit;
      return {
        label: fmt(v),
        bg: on ? '#24301A' : '#15131D',
        border: on ? '#C8F169' : '#2A2737',
        fg: on ? '#C8F169' : '#B4AFC6',
        aria: on ? 'true' : 'false',
        pick: () => set({ limit: v })
      };
    });

    const spent = current.spent;
    const left = limit - spent;
    const pct = Math.min(100, Math.round((spent / limit) * 100));
    let sub;
    let subColor = '#8E89A3';
    let barColor = '#C8F169';
    if (left < 0) {
      sub = 'صرفت ' + fmt(spent) + ' من أول الشهر · عدّيت الحد بـ ' + fmt(-left);
      subColor = '#FF8C73';
      barColor = '#FF8C73';
    } else if (spent === 0) {
      sub = 'لسه مصرفتش حاجة هنا الشهر ده';
    } else {
      sub = 'صرفت ' + fmt(spent) + ' من أول الشهر · فاضلك ' + fmt(left) + ' (' + fmt(left / 29) + ' في اليوم)';
      if (pct >= 80) barColor = '#FFB648';
    }

    return {
      cats: cats,
      presets: presets,
      limitLabel: fmt(limit),
      daily: fmt(limit / 30),
      pct: pct,
      sub: sub,
      subColor: subColor,
      barColor: barColor,
      rollAria: roll ? 'true' : 'false',
      rollTrack: roll ? '#C8F169' : '#3A3648',
      rollKnob: roll ? '#12160A' : '#B4AFC6',
      rollJustify: roll ? 'flex-end' : 'flex-start',
      toggleRoll: () => set({ roll: !roll })
    };
  }
}
</script>
</body>
</html>
