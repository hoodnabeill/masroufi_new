<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مصروفي · التقسيم التلقائي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Readex+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A10}
a{color:#A99BFF;text-decoration:none}a:hover{color:#C9C0FF}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 960px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0A10; color: #F4F2FA; font-family: 'IBM Plex Sans Arabic', sans-serif; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 12px;">

  <header style="display: flex; align-items: center; justify-content: space-between;">
    <a href="More.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A2737; background: #15131D; color: #F4F2FA; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 17px; font-weight: 600;">التقسيم التلقائي</h1>
    <span style="width: 44px;"></span>
  </header>
  <p style="margin: 0 4px; font-size: 14px; line-height: 1.6; color: #B4AFC6;">أول ما الدخل ينزل، مصروفي يقسمه لوحده على اللي يهمك.</p>

  <section style="padding: 16px 18px; border-radius: 24px; background: #15131D; border: 1px solid #2A2737; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 13px; color: #B4AFC6;">لما الدخل ينزل</span>
    <span style="display: flex; align-items: baseline; gap: 6px;"><span style="font-family: 'Readex Pro', sans-serif; font-size: 36px; font-weight: 700; letter-spacing: -1px;">{{incomeFmt}}</span><span style="font-size: 15px; color: #B4AFC6;">ج.م</span></span>
    <div style="display: flex; gap: 8px;">
      <sc-for list="{{incomes}}" as="i" hint-placeholder-count="3">
        <button onClick="{{i.pick}}" aria-pressed="{{i.aria}}" style="flex: 1 1 0; height: 38px; border-radius: 19px; border: 1px solid {{i.border}}; background: {{i.bg}}; color: {{i.fg}}; font-family: 'Readex Pro', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;">{{i.label}}</button>
      </sc-for>
    </div>
  </section>

  <div style="display: flex; gap: 8px;">
    <sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
      <button onClick="{{p.pick}}" aria-pressed="{{p.aria}}" style="flex: 1 1 0; height: 40px; border-radius: 20px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: 'Readex Pro', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;" dir="ltr">{{p.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; gap: 3px; height: 14px;">
      <div style="flex: {{needs}} 1 0; border-radius: 7px; background: #7DB4FF; transition: flex-grow 300ms ease;"></div>
      <div style="flex: {{wants}} 1 0; border-radius: 7px; background: #E7A6FF; transition: flex-grow 300ms ease;"></div>
      <div style="flex: {{save}} 1 0; border-radius: 7px; background: #C8F169; transition: flex-grow 300ms ease;"></div>
      <div style="flex: {{gap}} 1 0; border-radius: 7px; background: #272435;"></div>
    </div>
    <span style="font-size: 12px; font-weight: 600; color: {{sumColor}};">{{sumText}}</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{buckets}}" as="b" hint-placeholder-count="3">
      <div style="padding: 12px 14px; border-radius: 20px; background: #15131D; border: 1px solid #2A2737; display: flex; align-items: center; gap: 12px;">
        <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 13px; background: {{b.dim}}; color: {{b.c}}; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg></span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 14px; font-weight: 600;">{{b.name}}</span>
          <span style="font-size: 12px; color: #8E89A3;">{{b.sub}}</span>
          <span style="font-family: 'Readex Pro', sans-serif; font-size: 16px; font-weight: 600; color: {{b.c}};">{{b.amount}} ج.م</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <button onClick="{{b.inc}}" aria-label="زوّد" style="width: 34px; height: 34px; border-radius: 17px; border: 1px solid #2A2737; background: #1D1B28; color: #F4F2FA; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
          <span style="width: 42px; text-align: center; font-family: 'Readex Pro', sans-serif; font-size: 15px; font-weight: 700;">{{b.pct}}%</span>
          <button onClick="{{b.dec}}" aria-label="قلّل" style="width: 34px; height: 34px; border-radius: 17px; border: 1px solid #2A2737; background: #1D1B28; color: #F4F2FA; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        </div>
      </div>
    </sc-for>
  </div>

  <section style="padding: 14px 16px; border-radius: 20px; background: #1B1830; border: 1px solid #332C55; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 13px; color: #C9C0FF; font-weight: 600;">ده يعني</span>
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 13px;"><span style="color: #B4AFC6;">رقمك اليومي</span><span><span style="font-family: 'Readex Pro', sans-serif; font-size: 16px; font-weight: 700; color: #C8F169;">{{daily}}</span> ج.م في اليوم</span></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; gap: 12px;"><span style="color: #B4AFC6; white-space: nowrap;">هدف «موبايل جديد»</span><span style="text-align: left; font-weight: 600; color: {{goalColor}};">{{goalText}}</span></div>
  </section>

  <div style="padding: 12px 16px; border-radius: 20px; background: #15131D; border: 1px solid #2A2737; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 14px; font-weight: 600;">اعملها لوحدك كل مرة</span>
      <span style="font-size: 12px; color: #8E89A3;">{{autoSub}}</span>
    </div>
    <button onClick="{{toggleAuto}}" role="switch" aria-checked="{{autoAria}}" aria-label="تقسيم تلقائي" style="width: 48px; height: 28px; flex-shrink: 0; padding: 3px; box-sizing: border-box; border-radius: 14px; border: none; background: {{autoTrack}}; display: flex; justify-content: {{autoJustify}}; cursor: pointer;">
      <span style="width: 22px; height: 22px; border-radius: 11px; background: {{autoKnob}};"></span>
    </button>
  </div>

  <button onClick="{{noop}}" style="margin-top: auto; height: 56px; border-radius: 28px; border: none; background: {{saveBg}}; color: {{saveFg}}; font-family: 'Readex Pro', sans-serif; font-size: 17px; font-weight: 600; cursor: pointer;">احفظ القاعدة</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const income = s.income || 8000;
    const split = s.split || [50, 30, 20];
    const auto = s.auto != null ? s.auto : true;
    const set = (patch) => this.setState(patch);
    const fmt = (n) => Math.round(n).toLocaleString('en-US');
    const sum = split[0] + split[1] + split[2];

    const incomes = [5000, 8000, 12000].map((v) => {
      const on = v === income;
      return {
        label: fmt(v),
        aria: on ? 'true' : 'false',
        border: on ? '#C8F169' : '#2A2737',
        bg: on ? '#1A2114' : 'transparent',
        fg: on ? '#C8F169' : '#B4AFC6',
        pick: () => set({ income: v })
      };
    });

    const presetDefs = [[50, 30, 20], [60, 20, 20], [70, 20, 10]];
    const presets = presetDefs.map((p) => {
      const on = p[0] === split[0] && p[1] === split[1] && p[2] === split[2];
      return {
        label: p.join(' / '),
        aria: on ? 'true' : 'false',
        border: on ? '#A99BFF' : '#2A2737',
        bg: on ? '#262046' : 'transparent',
        fg: on ? '#E9E5FF' : '#B4AFC6',
        pick: () => set({ split: p.slice() })
      };
    });

    const change = (idx, delta) => () => {
      const cur = ((this.state && this.state.split) || [50, 30, 20]).slice();
      cur[idx] = Math.max(0, Math.min(100, cur[idx] + delta));
      set({ split: cur });
    };
    const defs = [
      { name: 'الأساسيات', sub: 'أكل، مواصلات، فواتير', c: '#7DB4FF', dim: '#1A2638', icon: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z' },
      { name: 'مصروفك الشخصي', sub: 'خروجات، ترفيه، قهوة', c: '#E7A6FF', dim: '#2E1F38', icon: 'M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 11h2a2 2 0 0 1 0 4h-2M8 3v3M12 3v3' },
      { name: 'الادخار والأهداف', sub: 'بيروح لـ «موبايل جديد»', c: '#C8F169', dim: '#24301A', icon: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 11.5v1' }
    ];
    const buckets = defs.map((d, i) => ({
      name: d.name,
      sub: d.sub,
      c: d.c,
      dim: d.dim,
      icon: d.icon,
      pct: split[i],
      amount: fmt((income * split[i]) / 100),
      inc: change(i, 5),
      dec: change(i, -5)
    }));

    const ok = sum === 100;
    const saveAmt = (income * split[2]) / 100;
    const daily = ((income * (split[0] + split[1])) / 100) / 30;
    let goalText;
    let goalColor;
    if (saveAmt >= 2000) {
      goalText = 'هيوصل في ميعاده أو قبله';
      goalColor = '#C8F169';
    } else {
      goalText = 'أقل من خطة الهدف بـ ' + fmt(2000 - saveAmt) + ' ج.م';
      goalColor = '#FFB648';
    }
    return {
      incomeFmt: fmt(income),
      incomes: incomes,
      presets: presets,
      buckets: buckets,
      needs: split[0],
      wants: split[1],
      save: split[2],
      gap: Math.max(0, 100 - sum),
      sumText: ok ? 'المجموع 100% · تمام' : (sum < 100 ? 'فاضل ' + (100 - sum) + '% مش متقسمين' : 'زيادة ' + (sum - 100) + '% عن الدخل'),
      sumColor: ok ? '#C8F169' : '#FF8C73',
      daily: fmt(daily),
      goalText: goalText,
      goalColor: goalColor,
      autoAria: auto ? 'true' : 'false',
      autoTrack: auto ? '#C8F169' : '#3A3648',
      autoKnob: auto ? '#12160A' : '#B4AFC6',
      autoJustify: auto ? 'flex-end' : 'flex-start',
      autoSub: auto ? 'من غير ما نسألك' : 'هنسألك الأول كل مرة',
      toggleAuto: () => set({ auto: !auto }),
      noop: () => {},
      saveBg: ok ? '#C8F169' : '#272435',
      saveFg: ok ? '#12160A' : '#8E89A3'
    };
  }
}
</script>
</body>
</html>
