name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.MASROUFI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No wrapper jar is committed; setup-gradle provisions a pinned Gradle instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Decode signing keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.MASROUFI_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MASROUFI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee build-output.log; exit ${PIPESTATUS[0]}

      - name: Build APKs
        env:
          VERSION_CODE: ${{ github.run_number }}
          MASROUFI_KEYSTORE_PASSWORD: ${{ secrets.MASROUFI_KEYSTORE_PASSWORD }}
          MASROUFI_KEY_ALIAS: ${{ secrets.MASROUFI_KEY_ALIAS }}
          MASROUFI_KEY_PASSWORD: ${{ secrets.MASROUFI_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease 2>&1 | tee -a build-output.log; exit ${PIPESTATUS[0]}

      # Surfaces compiler and test failures as one annotation so they are readable without opening the raw log.
      - name: Summarize failures
        if: failure()
        run: |
          errors=$(grep -E '^e: |error:|FAILED|What went wrong|Exception|expected:|^> ' build-output.log | grep -v 'BUILD FAILED' | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failures::${errors}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: masroufi-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore
